<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:0;background:var(--paper);}
  .stage{display:flex;gap:40px;padding:26px;align-items:center;flex-wrap:wrap;}
  .mark{display:inline-flex;align-items:center;gap:14px;font-family:var(--font-display);font-weight:900;font-size:34px;letter-spacing:-.02em;text-transform:uppercase;color:var(--ink);}
  .dot{width:22px;height:22px;border-radius:50%;background:var(--red);border:2px solid var(--ink);}
  .dark{background:var(--ink);color:var(--paper);padding:18px 22px;}
  .dark .mark{color:var(--paper);}
</style></head>
<body>
  <div class="stage">
    <span class="mark"><span class="dot"></span>Joel&nbsp;Peckham</span>
    <div class="dark"><span class="mark"><span class="dot" style="background:var(--yellow)"></span>Joel&nbsp;Peckham</span></div>
  </div>
</body></html>
