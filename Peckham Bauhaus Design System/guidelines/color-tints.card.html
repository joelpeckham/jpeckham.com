<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-mono);}
  .row{display:flex;gap:14px;}
  .sw{flex:1;height:110px;border:2px solid var(--ink);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
  .n{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .h{font-size:11px;opacity:.75;}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--red-deep)"> <span class="n" style="color:#fff">Red Deep</span><span class="h" style="color:#fff">#B4261D · --red-deep</span></div>
    <div class="sw" style="background:var(--blue-deep)"><span class="n" style="color:#fff">Blue Deep</span><span class="h" style="color:#fff">#16309B · --blue-deep</span></div>
    <div class="sw" style="background:var(--yellow-hi)"><span class="n">Yellow Hi</span><span class="h">#FFD52E · --yellow-hi</span></div>
    <div class="sw" style="background:var(--grey-line)"><span class="n">Line</span><span class="h">#CFC7B5 · --grey-line</span></div>
  </div>
</body></html>
