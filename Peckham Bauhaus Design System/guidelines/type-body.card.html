<!-- @dsCard group="Type" viewport="700x210" name="Body & Mono" subtitle="Reading text and code/meta voice" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--paper);color:var(--ink);}
  .lead{font-family:var(--font-body);font-size:20px;line-height:1.5;max-width:560px;margin:0 0 12px;}
  .body{font-family:var(--font-body);font-size:17px;line-height:1.65;color:#3a352e;max-width:560px;margin:0 0 16px;}
  .mono{font-family:var(--font-mono);font-size:13px;color:var(--blue);background:var(--white);border:2px solid var(--ink);display:inline-block;padding:6px 10px;}
</style></head>
<body>
  <p class="lead">Lead paragraph — Jost 400 at --text-lg for intros.</p>
  <p class="body">Body copy runs at --text-body with generous line-height for long-form reading. Warm ink on paper.</p>
  <span class="mono">const stack = ["ts","rust","go"]; // --font-mono</span>
</body></html>
