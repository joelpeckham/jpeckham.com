<!-- @dsCard group="Colors" viewport="700x150" name="Primary Palette" subtitle="Bauhaus red / blue / yellow" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-mono);}
  .row{display:flex;gap:14px;}
  .sw{flex:1;height:110px;border:2px solid var(--ink);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
  .n{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .h{font-size:11px;opacity:.75;}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--red)">   <span class="n" style="color:#fff">Red</span><span class="h" style="color:#fff">#E1352A · --red</span></div>
    <div class="sw" style="background:var(--blue)">  <span class="n" style="color:#fff">Blue</span><span class="h" style="color:#fff">#1F45D8 · --blue</span></div>
    <div class="sw" style="background:var(--yellow)"><span class="n">Yellow</span><span class="h">#F7C000 · --yellow</span></div>
  </div>
</body></html>
