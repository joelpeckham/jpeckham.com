<!-- @dsCard group="Type" viewport="700x260" name="Heading Scale" subtitle="H1 → H4, Jost bold" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:22px;background:var(--paper);color:var(--ink);}
  h1,h2,h3,h4{margin:0 0 10px;font-family:var(--font-display);font-weight:700;letter-spacing:-.02em;line-height:1.05;}
  h1{font-size:44px;} h2{font-size:32px;} h3{font-size:24px;} h4{font-size:19px;}
  span{font-family:var(--font-mono);font-size:11px;color:var(--grey);}
</style></head>
<body>
  <h1>Heading one <span>--text-h1</span></h1>
  <h2>Heading two <span>--text-h2</span></h2>
  <h3>Heading three <span>--text-h3</span></h3>
  <h4>Heading four <span>--text-h4</span></h4>
</body></html>
