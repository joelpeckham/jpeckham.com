<!-- @dsCard group="Brand" viewport="700x230" name="Composition — Grid + Shapes" subtitle="How graphic elements assemble" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;background:var(--paper);}
  .frame{position:relative;height:230px;overflow:hidden;border-bottom:3px solid var(--ink);}
  .c1{position:absolute;left:-40px;top:-40px;width:150px;height:150px;border-radius:50%;background:var(--blue);}
  .c2{position:absolute;right:60px;bottom:-50px;width:180px;height:90px;border-radius:180px 180px 0 0;background:var(--yellow);border:3px solid var(--ink);}
  .c3{position:absolute;right:-30px;top:30px;width:0;height:0;border-left:60px solid transparent;border-right:60px solid transparent;border-bottom:110px solid var(--red);}
  .txt{position:absolute;left:34px;bottom:26px;font-family:var(--font-display);font-weight:900;font-size:58px;line-height:.9;letter-spacing:-.02em;text-transform:uppercase;color:var(--ink);}
</style></head>
<body>
  <div class="frame">
    <div class="c1"></div><div class="c3"></div><div class="c2"></div>
    <div class="txt">Design<br>&amp; Code</div>
  </div>
</body></html>
