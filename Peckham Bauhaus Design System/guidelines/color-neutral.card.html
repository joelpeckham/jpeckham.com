<!-- @dsCard group="Colors" viewport="700x150" name="Ink & Paper" subtitle="Neutral ground and text" -->
<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
  body{margin:0;padding:20px;background:var(--paper);font-family:var(--font-mono);}
  .row{display:flex;gap:14px;}
  .sw{flex:1;height:110px;border:2px solid var(--ink);display:flex;flex-direction:column;justify-content:flex-end;padding:10px;}
  .n{font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;}
  .h{font-size:11px;opacity:.75;}
</style></head>
<body>
  <div class="row">
    <div class="sw" style="background:var(--ink)">    <span class="n" style="color:#fff">Ink</span><span class="h" style="color:#fff">#141210 · --ink</span></div>
    <div class="sw" style="background:var(--paper)">  <span class="n">Paper</span><span class="h">#F1EBDD · --paper</span></div>
    <div class="sw" style="background:var(--paper-2)"><span class="n">Paper 2</span><span class="h">#E7DFCC · --paper-2</span></div>
    <div class="sw" style="background:var(--white)"> <span class="n">White</span><span class="h">#FFFFFF · --white</span></div>
    <div class="sw" style="background:var(--grey)">  <span class="n" style="color:#fff">Grey</span><span class="h" style="color:#fff">#8C8578 · --grey</span></div>
  </div>
</body></html>
